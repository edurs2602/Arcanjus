services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arcanjus
      POSTGRES_PASSWORD: arcanjus_dev
      POSTGRES_DB: arcanjus
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arcanjus']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - backend_uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql://arcanjus:arcanjus_dev@postgres:5432/arcanjus
      JWT_SECRET: dev-secret-change-in-production-min-32-chars
      STORAGE_MODE: local
      UPLOADS_DIR: /app/uploads
      PORT: 3001
      NODE_ENV: development
      AI_PIPELINE_ENABLED: ${AI_PIPELINE_ENABLED:-false}
      VMAKE_API_KEY: ${VMAKE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PUBLIC_BACKEND_URL: http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
    command: pnpm dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      INTERNAL_API_URL: http://backend:3001/api/v1
    depends_on:
      - backend
    command: pnpm dev

volumes:
  pgdata:
  backend_uploads:
